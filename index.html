function escReg(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function translateDOM(lang){
 if(lang!=='en') return;
 const entries=Object.entries(I18N).sort((a,b)=>b[0].length-a[0].length);
 const replaceText=(text)=>{let out=text;for(const [fr,en] of entries){if(fr)out=out.split(fr).join(en)}return out};
 const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);nodes.forEach(n=>{if(n.parentElement && !['SCRIPT','STYLE'].includes(n.parentElement.tagName))n.nodeValue=replaceText(n.nodeValue)});
 document.querySelectorAll('input,textarea,select,button,[aria-label],[title]').forEach(el=>{['placeholder','aria-label','title'].forEach(a=>{if(el.hasAttribute(a))el.setAttribute(a,replaceText(el.getAttribute(a)))});if(el.tagName==='OPTION'||el.tagName==='BUTTON')el.textContent=replaceText(el.textContent)});
}
function applyLanguage(){const lang=localStorage.getItem('lang')||'fr';document.documentElement.lang=lang;document.querySelectorAll('.lang-switch [data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));route();}
